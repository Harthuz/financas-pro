server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Mcp-Session-Id" always;
    add_header X-MCP-Server "http://$http_host/mcp" always;
    add_header X-MCP-SSE "http://$http_host/sse" always;
    add_header X-MCP-Tools "http://$http_host/mcp/tools" always;
    add_header X-MCP-Diretrizes "http://$http_host/DIRETRIZES.md" always;
    add_header X-API-Tudo "http://$http_host/api/tudo" always;
    add_header X-API-Gastos "http://$http_host/api/gastos" always;
    add_header X-API-Stage "http://$http_host/api/stage" always;
    add_header X-Stage-UI "http://$http_host/stage" always;
    add_header X-API-Metadados "http://$http_host/api/metadados" always;
    add_header X-API-Backup-CSV "http://$http_host/api/exportar" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /sse {
        proxy_pass http://backend:8000/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /messages {
        proxy_pass http://backend:8000/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(DIRETRIZES\.md|GEMINI\.md|mcp_server\.py)$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /diretrizes.json {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
