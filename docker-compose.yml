services:
  db:
    image: postgres:16-alpine
    container_name: gastos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: gastos_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gastos_db
    restart: always
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gastos_frontend
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
